name: Bug 报告
description: 报告一个可复现的行为错误
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞不要开公开 Issue，按 [SECURITY.md](../SECURITY.md) 的渠道上报。
        提交前先搜索已有 Issue；报错原文与堆栈请完整贴出，不要截断。

  - type: textarea
    id: actual
    attributes:
      label: 现象
      description: 实际发生了什么。报错原文、堆栈、任务号都贴全。
      placeholder: 任务 t_20261118_xxx 执行到「跑测试」时报 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么，依据是哪份规格或文档。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始的完整步骤，包含配置文件片段（隐去 token）。
      placeholder: |
        1. bun install && cp pisa.config.example.json pisa.config.json
        2. 改 worker.concurrency 为 1
        3. 发 /pisa 跑测试并修掉失败
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: package.json 的 version，或 commit 短哈希。
      placeholder: 0.1.0 / a1b2c3d
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 触发通道
      description: 任务是从哪里进来的。
      options:
        - 私聊 / 群聊
        - webhook（POST /event）
        - CLI（pisa task / wait）
        - 定时任务（schedules）
        - 主动发现（关键词 / 探针）
        - GitHub 评论
        - 其他
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统与版本、bun --version、worker.adapter 用的是哪个实现。
      placeholder: macOS 27.2 / bun 1.4.4 / omp
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: .pisa/logs/<任务号>.log 的相关片段。贴之前手动删掉 token、路径中的用户名等敏感信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过已有 Issue，没有重复
          required: true
        - label: 这是一般的功能错误，不是安全漏洞
          required: true
