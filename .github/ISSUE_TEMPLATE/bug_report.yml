name: Bug 报告
description: 报告可复现的问题：步骤、期望、实际、环境
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜一遍已有 Issue。
        贴日志、截图、配置片段前，删掉 bot token、chat id、`GH_TOKEN`、私钥路径等敏感信息。

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始，按顺序写出可重放的步骤
      placeholder: |
        1. bun install && cp pisa.config.example.json pisa.config.json
        2. bun run dev
        3. 私聊发送 /pisa ...
        4. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 完整的报错或异常输出，不要只写「不工作」
      render: shell
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、bun 版本、omp 版本、pisa commit
      placeholder: "macOS 15 · bun 1.4.4 · omp 0.x.y · commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Router / 任务分派
        - Worker / 执行
        - 通道（Telegram / CLI / webhook）
        - GitHub 评论
        - 定时任务
        - 配置 / 启动
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 已删除日志、截图、配置片段中的 token、chat id 等敏感信息
          required: true
        - label: 已搜索过现有 Issue，没有重复
          required: false
